{% set name = "fg-data-profiling" %}
{% set version = "4.20.0" %}

package:
  name: fg-data-profiling
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/f/fg-data-profiling/fg_data_profiling-{{ version }}.tar.gz
  sha256: 2836994c6010408d30d1dc3cce082e65c4950e14aeb5fb3fad6544ff085734ad

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - data_profiling = data_profiling.controller.console:main
    - pandas_profiling = data_profiling.controller.console:main
  skip: true  # [py<310]
  

requirements:
  host:
    - python
    - pip
    - setuptools >=72.0.0,<81.0.0
    - setuptools-scm >=8.0.0,<9.0.0  # [not (win and arm64)]
    - setuptools-scm >=8.0.0  # [win and arm64]
    - wheel >=0.38.4,<1.0.0
  run:
    - python
    - scipy >=1.8,<1.19.0
    - pandas >1.5,<3.0,!=1.4.0
    - matplotlib-base >=3.5,<3.12
    - pydantic >=2,<3
    - pyyaml >=6.0.3,<6.1
    - jinja2 >=3.1.6,<3.2
    - visions >=0.7.5,<0.9
    - numpy >=1.22,<2.6
    - minify-html >=0.15.0
    - filetype >=1.0.0
    - phik >=0.12.5,<0.13
    - requests >=2.32.0,<3
    - tqdm >=4.66.3,<5
    - seaborn >=0.10.1,<0.14
    - multimethod >=1.4,<2
    - statsmodels >=0.13.2,<1
    - typeguard >=4,<5
    - imagehash ==4.3.2
    - wordcloud >=1.9.4
    - dacite >=1.9,<2
    - numba >=0.60,<0.68
    # dependencies from upstream: visions[type_image_path,type_geometry]
    # type_image_path
    - pillow
    - puremagic
    # type_geometry
    - shapely
  run_constrained:
    # notebook
    - jupyter >=1.0.0
    - ipywidgets >=7.5.1

# No tests provided by PyPi package, use `pip check` only
test:
  imports:
    - data_profiling
    - ydata_profiling
  commands:
    - pip check
    - data_profiling --help
    - pandas_profiling --help
  requires:
    - pip

about:
  home: https://ydata.ai
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Generate profile report for pandas DataFrame
  description: |
    fg-data-profiling primary goal is to provide a one-line Exploratory Data Analysis (EDA) experience
    in a consistent and fast solution. Like pandas df.describe() function,
    that is so handy, fg-data-profiling delivers an extended analysis of a DataFrame
    while allowing the data analysis to be exported in different formats such as html and json.
  dev_url: https://github.com/Data-Centric-AI-Community/fg-data-profiling
  doc_url: https://github.com/Data-Centric-AI-Community/fg-data-profiling

extra:
  recipe-maintainers:
    - avetr-work
